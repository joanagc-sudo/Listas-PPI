    <h1>Protocolo HTTP</h1>
    <p>O Protocolo de Transferência de Hipertexto (<span title="Hypertext Transfer Protocol"><u>HTTP</u></span>) é um protocolo de comunicação utilizado para a transferência de dados na World Wide Web. Ele define como os mensagens são formatados e transmitidos entre navegadores e servidores web.</p>
