<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4a display</title>

    <style>
        .container{
            width: 100%;
            height: 400px;
        }
        .box{
            display: block;
            height: 60px;
            line-height: 60px;  
            position:static;
            text-align: center;
        }
        #box1{
            background-color: blue;

        }#box2{
            background-color: darkgreen;
        }
        #box3{
            background-color: red;
        }
        #box4{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Display A</h1>
    <!--<p>Explicação: ao aplicar o display: block, cada elemento tem uma quebra de linha automática, as divs .box ocupam 100% da largura horizontal, pois não foi definido uma altura específica no CSS.</p>-->
    <div claas="container">

        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>

    </div>
</body>
</html>
