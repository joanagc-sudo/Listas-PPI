<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display B</title>
    <style>
        body{
            margin:0;
            font-size: 0;
        }
        .container{
           
        }
        .box{
            display: inline-block;
            width: 25%;
            height: 100px;
            text-align: center;
            line-height: 100px;
            font-size: 16px;
        }
        #box1{
            background-color: blue;

        }#box2{
            background-color: darkgreen;
        }
        #box3{
            background-color: red;
        }
        #box4{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <!--<h1>Display B</h1>
    <p>Explicação: ao aplicar o display: inline-block, os elementos passam a se alinhar lado a lado na horizontal, mas ainda tem propriedades de bloco, como altura e largura.</p>-->
    <div claas="container">

        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>

    </div>
</body>
</html>
