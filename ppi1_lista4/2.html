<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100vh;
        }

        .container {
            display: grid;
            min-height: 100vh;
            grid-template-areas:
                "header header"
                "nav content"
                "footer footer";
            grid-template-columns: 250px 1fr;
            grid-template-rows: 10% 1fr 10%;
        }

        header {
            grid-area: header;
            background-color: #f387ad;
            padding: 20px;
            text-align: center;
        }

        nav {
            grid-area: nav;
            background-color: #d1dea4;
            padding: 20px;
        }

        main {
            grid-area: content;
            display: contents;
        }

        article,
        content {
            background-color: #e2af98;
            padding: 20px;
        }

        content {
            display: block;
        }

        footer {
            grid-area: footer;
            background-color: #8acfa7;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <p>Header</p>
        </header>
        <main>
            <content>
                <p>Content</p>
            </content>
            <nav>
                <p>Nav</p>
            </nav>
        </main>
        <footer>
            <p>Footer</p>
        </footer>
    </div>
</body>

</html>
