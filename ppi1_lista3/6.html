<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            border: 0;
        }

        @media screen and (max-width: 600px){
            .container{
                display: flex;
                flex-direction: column;
            }
        }
        @media screen and (min-width: 601px){
           .container {
            height:98.6vh;
            display: grid;

            grid-template-columns: 1fr 1fr 1fr 0.5fr;
            grid-template-rows: 1fr 1fr 1fr;

            gap: 5px;
            padding: 5px;
        } 
        }
        


        #r1 {
            background-color: orangered;
            color: orangered;
            grid-column: 1;
            grid-row: 1;
        }

        #r2 {
            background-color: #eaabf9;
            color: #eaabf9;
            grid-column: 1;
            grid-row: 2;
        }

        #r3 {
            background-color: pink;
            color: pink;
            grid-column: 2;
            grid-row: 1 / 3;
        }

        #r4 {
            background-color: #f0771a;
            color: #f0771a;
            grid-column: 1 / 3;
            grid-row: 3;
        }

        #r5 {
            background-color: cornsilk;
            color: cornsilk;
            grid-column: 3;
            grid-row: 2 / 4;
        }

        #r6 {
            background-color: #3e6148;
            color: #3e6148;
            grid-column: 3 / 5;
            grid-row: 1;
        }

        .circulos {
            grid-column: 4;
            grid-row: 2 / 4;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .circ {
            width: 90px;
            height: 90px;
            border-radius: 50%;
        }

        #c1 {
            background-color: #f0883e;
            color: #f0883e;
        }

        #c2 {
            background-color: pink;
            color: pink;
        }

        #c3 {
            background-color: #3e6148;
            color: #3e6148;
        }

        #c4 {
            background-color: #eaabf9;
            color: #eaabf9;
        }


        .d1 {
            width: 40%;
            height: 80%;
        }


    </style>
</head>

<body>
    <div class="container">

        <div class="ret" id="r1">.</div>
        <div class="ret" id="r2">.</div>
        <div class="ret" id="r3">.</div>
        <div class="ret" id="r4">.</div>
        <div class="ret" id="r5">.</div>
        <div class="ret" id="r6">.</div>

        <div class="circulos">
            <div class="circ" id="c1">.</div>
            <div class="circ" id="c2">.</div>
            <div class="circ" id="c3">.</div>
            <div class="circ" id="c4">.</div>
        </div>



    </div>
</body>

</html>
