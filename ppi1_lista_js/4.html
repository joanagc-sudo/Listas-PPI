<body>

<div class = "container">
    <h3 id="titulo">bla</h3>

    <h1 id="imc"></h1>
    <div id="dig">
        <label>digite seu peso:</label>
        <input type="text" id="peso" placeholder="ex: 64" value="80">
        <br>
        <label>digite sua altura:</label>
        <input type="text" id="altura" placeholder="ex: 1.75" value="1.75">
        <br>
        <button id="btn">calcular</button>
        <p id="IMC"></p>

        <p id="class"></p>
        <p id="img"></p>


    </div>
</div>
    <script src="script2.js"></script>

<script>
let h3titulo = document.getElementById("titulo");
h3titulo.innerHTML = "I6 2026"

let h3 = document.createElement("h3")
//h3.innerHTML="ola"
document.body.appendChild(h3)
let p = document.getElementById("imc")
p.innerHTML = "IMC"
let inputPeso = document.getElementById("peso")
let inputAltura = document.getElementById("altura")
let calcular = document.querySelector("#btn")
let  pimc = document.querySelector("#IMC")
let  classific = document.querySelector("#class")
let imagem = document.querySelector("#img")
 
calcular.addEventListener("click", () =>{

let peso = Number.parseFloat(inputPeso.value)
console.log(typeof(peso))
let altura = Number.parseFloat(inputAltura.value)

let imc = peso/ (altura*altura)
console.log(imc)
pimc.innerHTML = imc.toFixed(2)

if(imc<18.5)
{
    console.log("Abaixo do peso")
    classific.innerHTML="Abaixo do peso";
} 

else if(imc>=18.5 && imc<25)
{
    console.log("Peso normal")
    classific.innerHTML="Peso normal";
} 

else if(imc>=25 && imc<30)
{
    console.log("Acima do peso")
    classific.innerHTML="Acima do peso";
} 

else if(imc>=30 && imc<35)
{
    console.log("Obesidade grau 1")
    classific.innerHTML="Obesidade grau 1";
} 

else if(imc>=35 && imc<40)
{
    console.log("Obesidade grau 2")
    classific.innerHTML="Obesidade grau 2";
} 

else if(imc>=40)
{
    console.log("Obesidade grau 3")
    classific.innerHTML="Obesidade grau 3";
}

switch (true){
    case (imc <= 18) : imagem.innerHTML='<img src="img/abaixopeso.png">'; break;
    case (imc >= 18) && (imc<25) : imagem.innerHTML='<img src="img/normal.png">'; break;
    case (imc >= 25) && (imc<30) : imagem.innerHTML='<img src="img/sobrepeso.png">'; break;
    case (imc >= 30) && (imc<35) : imagem.innerHTML='<img src="img/obesidade1.png">'; break;
    case (imc >= 35) && (imc<40) : imagem.innerHTML='<img src="img/obesidade2.png">'; break;
    case (imc >= 40) : imagem.innerHTML='<img src="img/obesidade3.png">'; break;
}

 });</script>
